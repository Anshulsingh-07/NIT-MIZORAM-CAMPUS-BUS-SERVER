services:
  - type: web
    name: nitmz-campus-bus-server
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 8080
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: postgres
      - key: DB_SSL
        value: true
      - key: CARETAKER_INITIAL_PASSWORD
        sync: false
      - key: CARETAKER_RECOVERY_EMAILS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false